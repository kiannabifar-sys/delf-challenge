<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Certificate Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600;700&family=Cinzel:wght@700;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  body{background:#03040c;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:20px;font-family:'Inter',sans-serif;}
  canvas{max-width:100%;height:auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.7);}
  .download-btn{position:fixed;bottom:20px;right:20px;padding:14px 28px;background:linear-gradient(135deg,#d4af37,#f4d03f);border:none;border-radius:14px;font-weight:700;cursor:pointer;font-size:14px;box-shadow:0 8px 24px rgba(212,175,55,0.4);}
</style>
</head>
<body>
<canvas id="certCanvas" width="1400" height="990"></canvas>
<button class="download-btn" onclick="download()">⬇️ Download PNG</button>
<script>
function drawCertificate(name, date){
  const canvas = document.getElementById('certCanvas');
  const ctx = canvas.getContext('2d');
  const W = 1400, H = 990;
  
  // Background
  const bgGrad = ctx.createLinearGradient(0,0,W,H);
  bgGrad.addColorStop(0,'#0a0a14');
  bgGrad.addColorStop(0.5,'#12122a');
  bgGrad.addColorStop(1,'#0a0a14');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0,0,W,H);
  
  // Radial glow
  const radial = ctx.createRadialGradient(W/2, H/2, 100, W/2, H/2, W/2);
  radial.addColorStop(0,'rgba(212,175,55,0.06)');
  radial.addColorStop(1,'transparent');
  ctx.fillStyle = radial;
  ctx.fillRect(0,0,W,H);
  
  // Dot pattern
  ctx.fillStyle = 'rgba(212,175,55,0.04)';
  for(let x=0;x<W;x+=28){ for(let y=0;y<H;y+=28){ ctx.beginPath(); ctx.arc(x,y,1.2,0,Math.PI*2); ctx.fill(); } }
  
  // Borders
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 5; ctx.strokeRect(32,32,W-64,H-64);
  ctx.strokeStyle = 'rgba(212,175,55,0.55)'; ctx.lineWidth = 2; ctx.strokeRect(52,52,W-104,H-104);
  ctx.strokeStyle = 'rgba(212,175,55,0.25)'; ctx.lineWidth = 1; ctx.strokeRect(64,64,W-128,H-128);
  
  // Corners
  const drawCorner = (x,y,flipX,flipY)=>{
    ctx.save(); ctx.translate(x,y); ctx.scale(flipX,flipY);
    ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0,55); ctx.lineTo(0,0); ctx.lineTo(55,0); ctx.stroke();
    ctx.beginPath(); ctx.arc(20,20,9,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(20,20,3,0,Math.PI*2); ctx.fillStyle='#d4af37'; ctx.fill();
    ctx.strokeStyle = 'rgba(212,175,55,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,75); ctx.lineTo(0,65); ctx.moveTo(65,0); ctx.lineTo(75,0); ctx.stroke();
    ctx.restore();
  };
  drawCorner(80,80,1,1); drawCorner(W-80,80,-1,1); drawCorner(80,H-80,1,-1); drawCorner(W-80,H-80,-1,-1);
  
  // Star
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 68px "Space Grotesk", sans-serif';
  ctx.textAlign = 'center';
  ctx.shadowColor = 'rgba(212,175,55,0.6)'; ctx.shadowBlur = 25;
  ctx.fillText('✦', W/2, 155);
  ctx.shadowBlur = 0;
  
  // Institute
  ctx.fillStyle = '#f0f4ff';
  ctx.font = 'bold 26px "Space Grotesk", sans-serif';
  ctx.fillText('DELF ENGLISH INSTITUTE', W/2, 210);
  
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 14px "Inter", sans-serif';
  ctx.fillText('INTERNATIONAL ENGLISH PROFICIENCY', W/2, 240);
  
  // Divider
  ctx.strokeStyle = 'rgba(212,175,55,0.4)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W/2-260, 262); ctx.lineTo(W/2+260, 262); ctx.stroke();
  ctx.fillStyle = '#d4af37';
  ctx.save(); ctx.translate(W/2, 262); ctx.rotate(Math.PI/4); ctx.fillRect(-4,-4,8,8); ctx.restore();
  
  // Title
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 68px "Cinzel", serif';
  ctx.fillText('CERTIFICATE', W/2, 355);
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 24px "Inter", sans-serif';
  ctx.fillText('OF ACHIEVEMENT', W/2, 395);
  
  // Presented to
  ctx.fillStyle = 'rgba(240,244,255,0.65)';
  ctx.font = 'italic 20px "Inter", sans-serif';
  ctx.fillText('This certificate is proudly presented to', W/2, 465);
  
  // Name
  const nameGrad = ctx.createLinearGradient(W/2-350, 0, W/2+350, 0);
  nameGrad.addColorStop(0,'#00e5ff');
  nameGrad.addColorStop(0.5,'#ffffff');
  nameGrad.addColorStop(1,'#d4af37');
  ctx.fillStyle = nameGrad;
  ctx.font = 'bold 76px "Space Grotesk", sans-serif';
  ctx.shadowColor = 'rgba(0,229,255,0.3)'; ctx.shadowBlur = 20;
  ctx.fillText(name, W/2, 545);
  ctx.shadowBlur = 0;
  
  ctx.strokeStyle = '#d4af37'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(W/2-380, 575); ctx.lineTo(W/2+380, 575); ctx.stroke();
  
  // Body
  ctx.fillStyle = 'rgba(240,244,255,0.85)';
  ctx.font = '20px "Inter", sans-serif';
  ctx.fillText('for successfully completing all 30 levels of the', W/2, 635);
  ctx.fillText('DELF English Challenge with exceptional proficiency', W/2, 665);
  ctx.fillText('in English grammar, vocabulary, and comprehension.', W/2, 695);
  
  ctx.fillStyle = '#d4af37';
  ctx.font = 'bold 22px "Space Grotesk", sans-serif';
  ctx.fillText('LEVEL 30 — MASTERY (CEFR C2)', W/2, 740);
  
  ctx.fillStyle = 'rgba(240,244,255,0.5)';
  ctx.font = '14px "Inter", sans-serif';
  ctx.fillText('FINAL SCORE: 285 / 300', W/2, 768);
  
  // DATE
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(240,244,255,0.55)';
  ctx.font = 'bold 12px "Inter", sans-serif';
  ctx.fillText('DATE OF ISSUE', 200, 855);
  ctx.fillStyle = '#f0f4ff';
  ctx.font = 'bold 20px "Inter", sans-serif';
  ctx.fillText(date, 200, 882);
  ctx.strokeStyle = 'rgba(212,175,55,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(200, 895); ctx.lineTo(430, 895); ctx.stroke();
  
  // SEAL
  ctx.save();
  ctx.translate(W/2, 850);
  ctx.shadowColor = 'rgba(212,175,55,0.6)'; ctx.shadowBlur = 30;
  ctx.beginPath(); ctx.arc(0,0,68,0,Math.PI*2);
  const sealGrad = ctx.createRadialGradient(0,-20,10,0,0,68);
  sealGrad.addColorStop(0,'#f4d03f');
  sealGrad.addColorStop(0.5,'#d4af37');
  sealGrad.addColorStop(1,'#8a7020');
  ctx.fillStyle = sealGrad; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = '#f4d03f'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,55,0,Math.PI*2);
  ctx.strokeStyle = 'rgba(10,10,20,0.4)'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(0,0,48,0,Math.PI*2);
  ctx.fillStyle = 'rgba(10,10,20,0.15)'; ctx.fill();
  ctx.fillStyle = '#0a0a14';
  ctx.font = 'bold 42px "Space Grotesk", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', 0, 15);
  ctx.font = 'bold 8px "Inter", sans-serif';
  ctx.fillText('OFFICIAL', 0, -28);
  ctx.fillText('SEAL', 0, 38);
  ctx.restore();
  
  // Ribbon
  ctx.fillStyle = '#8a7020';
  ctx.beginPath(); ctx.moveTo(W/2-30,918); ctx.lineTo(W/2-25,950); ctx.lineTo(W/2-8,935); ctx.lineTo(W/2,950); ctx.lineTo(W/2+8,935); ctx.lineTo(W/2+25,950); ctx.lineTo(W/2+30,918); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d4af37';
  ctx.beginPath(); ctx.moveTo(W/2-22,918); ctx.lineTo(W/2-18,940); ctx.lineTo(W/2-6,928); ctx.lineTo(W/2,940); ctx.lineTo(W/2+6,928); ctx.lineTo(W/2+18,940); ctx.lineTo(W/2+22,918); ctx.closePath(); ctx.fill();
  
  // SIGNATURE
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(240,244,255,0.55)';
  ctx.font = 'bold 12px "Inter", sans-serif';
  ctx.fillText('AUTHORIZED SIGNATURE', W-200, 855);
  ctx.fillStyle = '#f0f4ff';
  ctx.font = 'italic bold 42px "Great Vibes", cursive';
  ctx.fillText('Dr. E. Walker', W-200, 892);
  ctx.strokeStyle = 'rgba(212,175,55,0.55)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(W-430,895); ctx.lineTo(W-200,895); ctx.stroke();
  ctx.fillStyle = 'rgba(240,244,255,0.5)';
  ctx.font = '11px "Inter", sans-serif';
  ctx.fillText('Director, DELF English Institute', W-200, 912);
  
  // Bottom decoration
  ctx.strokeStyle = 'rgba(212,175,55,0.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(W/2-250, 962); ctx.lineTo(W/2+250, 962); ctx.stroke();
  ctx.fillStyle = '#d4af37';
  ctx.save(); ctx.translate(W/2, 962); ctx.rotate(Math.PI/4); ctx.fillRect(-3,-3,6,6); ctx.restore();
}

function download(){
  const link = document.createElement('a');
  link.download = 'DELF-Certificate-Sample.png';
  link.href = document.getElementById('certCanvas').toDataURL('image/png');
  link.click();
}

// Draw sample
drawCertificate('Sarah Johnson', 'November 15, 2026');
</script>
</body>
</html>
